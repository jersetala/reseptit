{% macro recipe_form(action, submit_text, recipe=none) %}
    <form method="post" action="{{  action }}">
        <p>
            <label for="title">Title:</label>
            <input
                type="text" name="title" required
                {% if recipe %}
                    class="test"
                    value="{{ recipe.title }}"
                {% else %}
                    value=""
                {% endif %}
            />
        </p>
        <p>
            <label for="content">Content:</label>
            <textarea
                name="content"
                rows="5"
                cols="40"
                required
            >{%- if recipe -%}
                {{- recipe.content -}}
             {% endif %}</textarea>
        </p>
        <input type="hidden" name="recipe_id" value="{{ recipe.recipe_id }}">
        <button type="submit">
            {{ submit_text }}
        </button>
    </form>
{% endmacro %}
