<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{% block title %}Reseptit{% endblock %}</title>
        {% block head %}
        {% endblock %}
    </head>
    <body>
        <nav>
            <ol>
                <li><a href="/">Index</a></li>
            </ol>
            <form action="/search" method="get" role="search">
                <label for="recipe-search">Search</label>
                <input
                    type="search"
                    id="recipe-search"
                    name="q"
                    placeholder="Search..."
                />
                <button type="submit">Search</button>
            </form>
        </nav>
        <header>
            <a href="/">Reseptit</a>
        </header>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flashes">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        {% block body %}{% endblock %}
    </body>
</html>
