<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{% block title %}Reseptit{% endblock %}</title>
        {% block head %}
        {% endblock %}
    </head>
    <body>
        <nav>
            <ul>
                <li><a href="/">Reseptit</a></li>
                <li>
                    <form action="/search" method="get" role="search">
                        <label for="recipe-search">Search</label>
                        <input
                            type="search"
                            id="recipe-search"
                            name="q"
                            placeholder="Search..."
                        />
                        <button type="submit">Search</button>
                    </form>
                </li>
            </ul>
        </nav>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flashes">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        {% block body %}{% endblock %}
    </body>
</html>
